spring.application.name=Eventify_4

# AUDITORÍA SQL Y OBSERVABILIDAD (JPA / HIBERNATE)

# 1. Dirección, puerto y nombre de la base de datos MySQL (ej. f1_db)
spring.datasource.url=jdbc:mysql://localhost:3306/venues_and_events_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# 2. Credenciales de acceso a tu servidor MySQL
spring.datasource.username=root
spring.datasource.password=123456

# 3. Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 4. Dialecto de Hibernate para MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8081

# 1. Habilitar la impresión de sentencias SQL
spring.jpa.show-sql=true

# 2. Formatear las sentencias SQL en múltiples líneas para facilitar la lectura
spring.jpa.properties.hibernate.format_sql=true

# 3. Incluir comentarios informativos en el SQL generado (indica el JPQL de origen)
spring.jpa.properties.hibernate.use_sql_comments=true

# 4. Registrar sentencias SQL a través del logger de Hibernate (nivel DEBUG)
logging.level.org.hibernate.SQL=DEBUG

# 5. Registrar el valor real de los parámetros enlazados (BasicBinder en TRACE)
# Para Hibernate 5 / clásico:
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Para Hibernate 6+ (Spring Boot 3 y superior):
# En Hibernate 6 el paquete de binding cambió a orm.jdbc.bind. Se recomienda incluirlo:
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# GESTIÓN DE ESQUEMA: HIBERNATE VS FLYWAY

# 1. Desactivar creación/modificación automática de tablas por Hibernate
# 'validate' verifica que las entidades coincidan con las tablas creadas por Flyway sin alterarlas
spring.jpa.hibernate.ddl-auto=update

# 2. Habilitar Flyway
spring.flyway.enabled=true

# 3. Ubicación de los scripts de migración (por defecto)
spring.flyway.locations=classpath:db/migration

# 4. Si la base de datos ya tenía datos previos no versionados (opcional pero recomendado)
spring.flyway.baseline-on-migrate=true