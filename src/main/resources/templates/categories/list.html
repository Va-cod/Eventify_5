<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Categorías de Eventos')}"></head>
<body>

    <!-- Header / Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <!-- Main Content -->
    <main class="container my-4 flex-grow-1">

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Inicio</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Categorías</li>
                    </ol>
                </nav>
                <h2 class="fw-bold mb-0">
                    <i class="bi bi-tags text-primary me-2"></i> Gestión de Categorías
                </h2>
            </div>
            <a th:href="@{/categories/new}" class="btn btn-primary-custom d-flex align-items-center gap-1">
                <i class="bi bi-plus-lg"></i> Nueva Categoría
            </a>
        </div>

        <div class="card card-custom">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="ps-4" style="width: 80px;">ID</th>
                                <th style="width: 250px;">Nombre</th>
                                <th>Descripción</th>
                                <th class="text-end pe-4" style="width: 160px;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categories}">
                                <td class="ps-4 fw-semibold text-muted" th:text="'#' + ${cat.id}">#1</td>
                                <td>
                                    <span class="badge badge-category fs-6 fw-semibold" th:text="${cat.name}">Concierto</span>
                                </td>
                                <td class="text-secondary" th:text="${cat.description}">Descripción de la categoría</td>
                                <td class="text-end pe-4">
                                    <div class="d-inline-flex gap-1">
                                        <a th:href="@{/categories/edit/{id}(id=${cat.id})}" class="btn btn-sm btn-outline-primary" title="Editar Categoría">
                                            <i class="bi bi-pencil-square"></i>
                                        </a>
                                        <form th:action="@{/categories/delete/{id}(id=${cat.id})}" method="post"
                                              onsubmit="return confirm('¿Está seguro de eliminar esta categoría?');" style="display:inline;">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar Categoría">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(categories)}">
                                <td colspan="4" class="text-center py-5 text-muted">
                                    <i class="bi bi-tags fs-1 d-block mb-2 text-secondary"></i>
                                    No hay categorías registradas en este momento.
                                    <div class="mt-2">
                                        <a th:href="@{/categories/new}" class="btn btn-sm btn-outline-primary">Registrar la primera categoría</a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
