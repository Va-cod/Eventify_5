<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head(${isEdit ? 'Editar Categoría' : 'Nueva Categoría'})}"></head>
<body>

    <!-- Header / Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <!-- Main Content -->
    <main class="container my-4 flex-grow-1">

        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">

                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-2">
                        <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Inicio</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/categories}" class="text-decoration-none">Categorías</a></li>
                        <li class="breadcrumb-item active" aria-current="page" th:text="${isEdit ? 'Editar' : 'Nueva'}">Formulario</li>
                    </ol>
                </nav>

                <div class="card card-custom">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h4 class="mb-0 fw-bold">
                            <i th:class="${isEdit ? 'bi bi-pencil-square text-primary me-2' : 'bi bi-plus-circle text-primary me-2'}"></i>
                            <span th:text="${isEdit ? 'Editar Categoría' : 'Nueva Categoría'}">Título del Formulario</span>
                        </h4>
                    </div>
                    <div class="card-body p-4">

                        <form th:action="${isEdit ? '/categories/edit/' + id : '/categories/new'}"
                              th:object="${category}" method="post" novalidate>

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">
                                    Nombre de la Categoría <span class="text-danger">*</span>
                                </label>
                                <input type="text" id="name" th:field="*{name}" class="form-control form-control-lg"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                       placeholder="Ej. Conciertos, Conferencias, Teatro" maxlength="50" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                    El nombre es obligatorio.
                                </div>
                                <div class="form-text">Máximo 50 caracteres. Debe ser un nombre único en el sistema.</div>
                            </div>

                            <!-- Descripción -->
                            <div class="mb-4">
                                <label for="description" class="form-label fw-semibold">
                                    Descripción <span class="text-danger">*</span>
                                </label>
                                <textarea id="description" th:field="*{description}" class="form-control" rows="3"
                                          th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                                          placeholder="Breve reseña sobre los eventos que abarca esta categoría..." maxlength="150" required></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
                                    La descripción es obligatoria.
                                </div>
                                <div class="form-text">Máximo 150 caracteres.</div>
                            </div>

                            <!-- Botones -->
                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a th:href="@{/categories}" class="btn btn-outline-secondary px-4">
                                    <i class="bi bi-x-circle me-1"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary-custom px-4">
                                    <i class="bi bi-check2-circle me-1"></i>
                                    <span th:text="${isEdit ? 'Guardar Cambios' : 'Crear Categoría'}">Guardar</span>
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
