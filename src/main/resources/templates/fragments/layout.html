<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="html_head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Eventify'">Eventify</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .nav-link {
            font-weight: 500;
            color: #cbd5e1 !important;
            transition: all 0.2s ease;
        }
        .nav-link:hover, .nav-link.active {
            color: #ffffff !important;
            transform: translateY(-1px);
        }
        .card-custom {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            background-color: #ffffff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .badge-capacity {
            background-color: #e0f2fe;
            color: #0369a1;
            font-weight: 600;
        }
        .badge-category {
            background-color: #f3e8ff;
            color: #7e22ce;
            font-weight: 600;
        }
        .btn-primary-custom {
            background-color: #4f46e5;
            border-color: #4f46e5;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            padding: 8px 18px;
            transition: all 0.2s;
        }
        .btn-primary-custom:hover {
            background-color: #4338ca;
            border-color: #4338ca;
            color: white;
            transform: translateY(-1px);
        }
        footer {
            margin-top: auto;
            background-color: #0f172a;
            color: #94a3b8;
        }
        .table-custom th {
            background-color: #f1f5f9;
            color: #475569;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .stat-card-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <!-- Navbar Fragment -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4 text-white" th:href="@{/}">
                <i class="bi bi-calendar-event text-warning"></i> Eventify
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-indicator"><i class="bi bi-list fs-3 text-white"></i></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/events}">
                            <i class="bi bi-calendar3 me-1"></i> Eventos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/venues}">
                            <i class="bi bi-geo-alt me-1"></i> Lugares
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/categories}">
                            <i class="bi bi-tags me-1"></i> Categorías
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a th:href="@{/events/new}" class="btn btn-warning btn-sm fw-semibold rounded-pill px-3 shadow-sm">
                        <i class="bi bi-plus-circle me-1"></i> Nuevo Evento
                    </a>
                    <a href="/swagger-ui/index.html" target="_blank" class="btn btn-outline-light btn-sm rounded-pill px-3" title="Swagger API Docs">
                        <i class="bi bi-code-slash me-1"></i> API Docs
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Alerts Fragment -->
    <div th:fragment="alerts" class="container mt-3">
        <!-- Success Alert -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2 shadow-sm rounded-3" role="alert">
            <i class="bi bi-check-circle-fill fs-5 text-success"></i>
            <div th:text="${successMessage}">Operación realizada con éxito</div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Error Alert -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 shadow-sm rounded-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-5 text-danger"></i>
            <div th:text="${errorMessage}">Ha ocurrido un error</div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- Footer Fragment -->
    <footer th:fragment="footer" class="py-4">
        <div class="container text-center">
            <p class="mb-1 text-white fw-semibold">Eventify &copy; 2026 - Gestión Integral de Eventos, Lugares y Categorías</p>
            <small class="text-secondary">Desarrollado con Spring Boot 4 &amp; Thymeleaf</small>
        </div>
        <!-- Bootstrap JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </footer>

</body>
</html>
