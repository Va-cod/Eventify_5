<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Gestión de Eventos')}"></head>
<body>

    <!-- Header / Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <!-- Main Content -->
    <main class="container my-4 flex-grow-1">

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Inicio</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Eventos</li>
                    </ol>
                </nav>
                <h2 class="fw-bold mb-0">
                    <i class="bi bi-calendar-event text-primary me-2"></i> Gestión de Eventos
                </h2>
            </div>
            <a th:href="@{/events/new}" class="btn btn-primary-custom d-flex align-items-center gap-1">
                <i class="bi bi-calendar-plus"></i> Programar Nuevo Evento
            </a>
        </div>

        <!-- Filter Card -->
        <div class="card card-custom mb-4">
            <div class="card-body p-3">
                <form th:action="@{/events}" method="get" class="row g-2 align-items-end">
                    <!-- Ciudad -->
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold text-muted mb-1">
                            <i class="bi bi-geo-alt me-1"></i> Ciudad
                        </label>
                        <input type="text" name="city" class="form-control form-control-sm"
                               placeholder="Ej. Bogotá, Medellín..." th:value="${selectedCity}">
                    </div>

                    <!-- Categoría -->
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold text-muted mb-1">
                            <i class="bi bi-tags me-1"></i> Categoría
                        </label>
                        <select name="category" class="form-select form-select-sm">
                            <option value="">-- Todas las Categorías --</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.name}"
                                    th:text="${cat.name}"
                                    th:selected="${cat.name == selectedCategory}">
                                Música
                            </option>
                        </select>
                    </div>

                    <!-- Fecha Desde -->
                    <div class="col-md-2">
                        <label class="form-label small fw-semibold text-muted mb-1">
                            <i class="bi bi-calendar-date me-1"></i> Desde
                        </label>
                        <input type="date" name="startDate" class="form-control form-control-sm" th:value="${startDate}">
                    </div>

                    <!-- Fecha Hasta -->
                    <div class="col-md-2">
                        <label class="form-label small fw-semibold text-muted mb-1">
                            <i class="bi bi-calendar-date me-1"></i> Hasta
                        </label>
                        <input type="date" name="endDate" class="form-control form-control-sm" th:value="${endDate}">
                    </div>

                    <!-- Botones de Filtrar y Limpiar -->
                    <div class="col-md-2 d-flex gap-1">
                        <button type="submit" class="btn btn-sm btn-primary-custom flex-grow-1">
                            <i class="bi bi-funnel me-1"></i> Filtrar
                        </button>
                        <a th:href="@{/events}" class="btn btn-sm btn-outline-secondary" title="Limpiar filtros">
                            <i class="bi bi-arrow-counterclockwise"></i>
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Events Table -->
        <div class="card card-custom">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="ps-4" style="width: 70px;">ID</th>
                                <th>Nombre del Evento</th>
                                <th>Fecha Programada</th>
                                <th>Lugar</th>
                                <th>Ciudad</th>
                                <th>Categoría</th>
                                <th>Estado</th>
                                <th class="text-end pe-4" style="width: 170px;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="event : ${events}">
                                <td class="ps-4 fw-semibold text-muted" th:text="'#' + ${event.id}">#1</td>
                                <td>
                                    <a th:href="@{/events/{id}(id=${event.id})}" class="fw-bold text-dark text-decoration-none" th:text="${event.name}">
                                        Nombre del Evento
                                    </a>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border">
                                        <i class="bi bi-calendar-check me-1 text-primary"></i>
                                        <span th:text="${event.date}">2026-11-20</span>
                                    </span>
                                </td>
                                <td th:text="${event.venueName}">Estadio</td>
                                <td th:text="${event.venueCity}">Bogotá</td>
                                <td>
                                    <span class="badge badge-category" th:text="${event.categoryName}">Música</span>
                                </td>
                                <td>
                                    <span class="badge bg-success-subtle text-success border border-success-subtle">
                                        <i class="bi bi-check-circle me-1"></i> Activo
                                    </span>
                                </td>
                                <td class="text-end pe-4">
                                    <div class="d-inline-flex gap-1">
                                        <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-sm btn-outline-secondary" title="Ver Detalle">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/events/edit/{id}(id=${event.id})}" class="btn btn-sm btn-outline-primary" title="Editar Evento">
                                            <i class="bi bi-pencil-square"></i>
                                        </a>
                                        <form th:action="@{/events/delete/{id}(id=${event.id})}" method="post"
                                              onsubmit="return confirm('¿Está seguro de eliminar (desactivar) este evento?');" style="display:inline;">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar Evento">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(events)}">
                                <td colspan="8" class="text-center py-5 text-muted">
                                    <i class="bi bi-calendar-x fs-1 d-block mb-2 text-secondary"></i>
                                    No se encontraron eventos con los criterios seleccionados.
                                    <div class="mt-2">
                                        <a th:href="@{/events/new}" class="btn btn-sm btn-outline-primary">Programar un nuevo evento</a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
